name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 版本取自 root package.json 的 packageManager 字段，避免与本地 pnpm 漂移。
      - uses: pnpm/action-setup@v4

      # Node 版本取自 .nvmrc，与本地 nvm use 用的是同一个来源。
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify
